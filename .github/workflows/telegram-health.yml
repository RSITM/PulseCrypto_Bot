name: PulseCrypto Telegram Health Monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check health without sending Telegram or updating alert state'
        type: boolean
        required: false
        default: true

permissions:
  actions: read
  contents: write

concurrency:
  group: pulsecrypto-telegram-health
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout independent health checker
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install requests
      - name: Run offline tests before monitoring
        run: python -m unittest discover -s tests -v
      - name: Restore independent alert history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin health-state
          git show origin/health-state:health_state.json > health_state.json
          test -s health_state.json
      - name: Check running automation and notify on change
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = "true" ]; then
            python health_monitor.py --state health_state.json --dry-run
          else
            python health_monitor.py --state health_state.json
          fi
      - name: Persist alerts separately from paper account
        if: inputs.dry_run == false
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/pulse-health" origin/health-state
          cp health_state.json "$RUNNER_TEMP/pulse-health/health_state.json"
          git -C "$RUNNER_TEMP/pulse-health" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/pulse-health" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/pulse-health" add health_state.json
          if ! git -C "$RUNNER_TEMP/pulse-health" diff --cached --quiet; then
            git -C "$RUNNER_TEMP/pulse-health" commit -m "Update PulseCrypto Telegram health alert state"
            git -C "$RUNNER_TEMP/pulse-health" push origin HEAD:health-state
          else
            echo "Health status unchanged"
          fi
