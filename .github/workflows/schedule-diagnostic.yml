name: PulseCrypto Schedule Diagnostic

on:
  workflow_dispatch:
  schedule:
    - cron: '13,28,43,58 * * * *'

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report trigger and UTC time
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "PulseCrypto scheduler diagnostic re-registered"
          echo "Trigger: $EVENT_NAME"
          echo "Branch: $REF_NAME"
          echo "Default branch: $DEFAULT_BRANCH"
          date -u '+Runner UTC: %Y-%m-%dT%H:%M:%SZ'
          echo "No market scans, no account writes, no Telegram messages."
