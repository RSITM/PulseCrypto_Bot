name: PulseCrypto TJR-Inspired Public-Method Crypto Research

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Read-only matched historical 5m data (default 7 days)'
        type: choice
        required: true
        default: '7'
        options:
          - '7'
          - '14'
          - '30'

permissions:
  contents: read

concurrency:
  group: pulsecrypto-tjr-public-method-manual-research
  cancel-in-progress: false

jobs:
  tjr-public-ict-crypto-research:
    if: github.ref == 'refs/heads/main'
    name: Manual TJR-public-concepts vs BTC ETH SOL adaptation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repo in READ-ONLY research mode
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public market data dependency
        run: python -m pip install requests
      - name: Run offline regression tests
        run: python -m unittest discover -s tests -v
      - name: Download contiguous BTC ETH SOL public Binance.US 5m history
        run: |
          python v2a_history.py --days ${{ inputs.days }} \
            --out report_output/tjr-verified-5m-data.json
      - name: Compare public-method and crypto-adapted TJR-inspired strategies
        run: |
          python tjr_historical.py \
            --data report_output/tjr-verified-5m-data.json \
            --json report_output/TJR-Public-Crypto-Research.json \
            --markdown report_output/TJR-Public-Crypto-Research.md
      - name: Display research, results and risks
        run: cat report_output/TJR-Public-Crypto-Research.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive reproducible public market data and research results
        uses: actions/upload-artifact@v4
        with:
          name: pulsecrypto-tjr-public-concepts-${{ inputs.days }}-days
          path: report_output/
          retention-days: 7
          if-no-files-found: error
